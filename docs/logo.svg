<svg xmlns="http://www.w3.org/2000/svg" width="820" height="180" viewBox="0 0 820 180"
     role="img" aria-label="Lockstep — spending limits enforced by the ledger">
  <title>Lockstep</title>
  <desc>Two keys advancing together. Neither moves the money alone; the payment
        only steps forward where both are present.</desc>

  <style>
    .wordmark { fill: #0f1216; }
    .tag      { fill: #737d8a; }
    .rail     { stroke: #333a44; }
    .key      { stroke: #333a44; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #f5f7f9; }
      .tag      { fill: #8d97a4; }
      .rail     { stroke: #4a535f; }
      .key      { stroke: #ccd3dc; }
    }
  </style>

  <defs>
    <!-- userSpaceOnUse because a horizontal line has a zero-height bounding box,
         and an objectBoundingBox gradient on one degenerates to nothing drawn. -->
    <linearGradient id="live" gradientUnits="userSpaceOnUse" x1="96" y1="90" x2="214" y2="90">
      <stop offset="0"   stop-color="#25b394" stop-opacity=".25"/>
      <stop offset=".15" stop-color="#25b394"/>
      <stop offset="1"   stop-color="#25b394"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ── mark ─────────────────────────────────────────────────────────────
       Two rails, one per key. A payment advances only across the span where
       both are engaged: the lit segment is exactly the overlap, and it stops
       the moment either rail ends. That is the whole guarantee, drawn. -->

  <g class="rail" stroke-width="2" opacity=".45" stroke-linecap="round">
    <line x1="26" y1="62" x2="286" y2="62"/>
    <line x1="26" y1="118" x2="286" y2="118"/>
  </g>

  <!-- the agent's key: engaged for the first stretch -->
  <g class="key" stroke-width="7" stroke-linecap="round" opacity=".9">
    <line x1="46" y1="62" x2="214" y2="62"/>
  </g>
  <!-- the co-signer's key: engaged for the second -->
  <g class="key" stroke-width="7" stroke-linecap="round" opacity=".9">
    <line x1="96" y1="118" x2="266" y2="118"/>
  </g>

  <!-- where both are present, and only there, value moves -->
  <g fill="none" stroke-linecap="round">
    <line x1="96" y1="90" x2="214" y2="90" stroke="url(#live)" stroke-width="11"
          filter="url(#glow)" opacity=".5"/>
    <line x1="96" y1="90" x2="214" y2="90" stroke="url(#live)" stroke-width="11"/>
  </g>
  <!-- the step: it does not continue past the overlap -->
  <path d="M214 90 L246 90" class="rail" stroke-width="2" stroke-dasharray="4 6"
        stroke-linecap="round" opacity=".5"/>

  <!-- ── wordmark ───────────────────────────────────────────────────────── -->
  <g transform="translate(320 0)">
    <text class="wordmark" x="0" y="96"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
          font-size="62" font-weight="650" letter-spacing="-1.6">Lockstep</text>
    <text class="tag" x="3" y="124"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" letter-spacing=".6">two keys · one budget · enforced by consensus</text>
  </g>
</svg>
